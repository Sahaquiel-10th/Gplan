name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configure restricted SSH access
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package source
        run: |
          git archive --format=tar --output=/tmp/gplan-${GITHUB_SHA}.tar HEAD

      - name: Upload source package
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: >-
          scp -O
          -i ~/.ssh/deploy_key
          -P "$DEPLOY_PORT"
          -o BatchMode=yes
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          "/tmp/gplan-${GITHUB_SHA}.tar"
          "$DEPLOY_USER@$DEPLOY_HOST:/tmp/gplan-${GITHUB_SHA}.tar"

      - name: Deploy uploaded package
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: >-
          ssh -i ~/.ssh/deploy_key
          -p "$DEPLOY_PORT"
          -o BatchMode=yes
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          "$DEPLOY_USER@$DEPLOY_HOST"
          "set -e;
          cd /opt/gplan;
          sudo mkdir -p /tmp/gplan-deploy-${GITHUB_SHA};
          sudo tar -xf /tmp/gplan-${GITHUB_SHA}.tar -C /tmp/gplan-deploy-${GITHUB_SHA};
          sudo rsync -a --delete
          --exclude .env
          --exclude data/
          --exclude node_modules/
          /tmp/gplan-deploy-${GITHUB_SHA}/ /opt/gplan/;
          printf '%s\n' '${GITHUB_SHA}' | sudo tee /opt/gplan/REVISION >/dev/null;
          sudo npm ci;
          sudo npm run build;
          sudo pm2 restart gplan-ai --update-env || sudo pm2 start deploy/ecosystem.config.cjs --update-env;
          sudo pm2 save;
          sudo rm -rf /tmp/gplan-deploy-${GITHUB_SHA} /tmp/gplan-${GITHUB_SHA}.tar"
